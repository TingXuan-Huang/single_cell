[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellfm"
version = "0.1.0"
description = "From-scratch brain-specialized cell foundation model on Allen ABC Atlas: encoder bake-off at 1M / 3M params"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tingxuan Huang" }]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",
    "tqdm>=4.65",
    "wandb>=0.16",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
allen = [
    "abc-atlas-access",
    # scVI baseline (Direction-D "compress then dense" — see notes/pipeline_v1_plan.md).
    # 1.1+ has the stable PyTorch backend + `model.get_latent_representation`.
    "scvi-tools>=1.1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cellfm*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
